# Based on P3TERX/Actions-OpenWrt (MIT).
name: Update Checker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      triggered: ${{ steps.receipt.outputs.triggered }}
    steps:
      - name: Checkout build configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify locked upstream release
        id: source
        shell: bash
        run: |
          source sources.lock
          git init .upstream
          git -C .upstream remote add origin "$OPENWRT_URL"
          git -C .upstream fetch --depth=1 origin "$OPENWRT_REF"
          actual=$(git -C .upstream rev-parse 'FETCH_HEAD^{commit}')
          test "$actual" = "$OPENWRT_COMMIT"
          echo "sha=$actual" >> "$GITHUB_OUTPUT"

      - name: Check dispatch receipt cache
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .dispatch-trigger
          key: dispatch-${{ steps.source.outputs.sha }}-${{ hashFiles('sources.lock', '.config', 'diy-part1.sh', 'files/**', 'configs/**', 'scripts/**', 'docker/**', 'docs/**', '.github/workflows/build-openwrt.yml', '.github/workflows/update-checker.yml') }}

      - name: Trigger locked firmware build
        if: success() && steps.cache.outputs.cache-hit != 'true'
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.ACTIONS_TRIGGER_PAT }}
          event-type: Source Code Update
          client-payload: '{"sha":"${{ steps.source.outputs.sha }}"}'

      - name: Record successful dispatch only
        id: receipt
        if: success() && steps.cache.outputs.cache-hit != 'true'
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          printf '%s\n' "$SOURCE_SHA" > .dispatch-trigger
          echo 'triggered=true' >> "$GITHUB_OUTPUT"
          echo 'Dispatch receipt saved; this is NOT evidence of a successful build.'
          echo 'Use Build OpenWrt directly to retry a failed build with the same lock.'

  cleanup-runs:
    needs: check
    if: success() && needs.check.outputs.triggered == 'true'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Delete old checker workflow runs
        uses: Mattraks/delete-workflow-runs@b3018382ca039b53d238908238bd35d1fb14f8ee # v2.1.0
        with:
          retain_days: 1
          keep_minimum_runs: 1
          delete_workflow_pattern: update-checker.yml
